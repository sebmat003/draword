<div class="side-panel side-left">
  <div class="text-center justify-content-center">
    <div class="mt-3">Goal: {{ room.goal }}</div>
    <div class="table-header">Players</div>
  </div>
  <ul class="list-group">
    <li class="list-group-item primary clickable" *ngFor="let player of game.players; let i = index">
      <div class="d-flex justify-content-center align-items-center">
        <div class="player-umber w-25" [class]="i > 2 ? 'secondary' : 'primary'">
          {{ i + 1 }}
        </div>
        <div class="d-flex flex-row flex-wrap" style="width: 30%">
          <div>{{ player.name }}</div>
          <div class="text-small display-block">
            {{ player.currentPoints || 0 }} points
          </div>
        </div>
        <div class="w-25">
          <app-display-character [characterSet]="player.details.characterSet" width="5rem"
            height="5rem"></app-display-character>
        </div>
      </div>
    </li>
  </ul>
</div>
